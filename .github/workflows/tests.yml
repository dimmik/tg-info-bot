name: Tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            TgInfoBot/TgInfoBot.sln
            TgInfoBot/**/*.csproj
            TgInfoBot.Tests/**/*.csproj

      - name: Restore
        run: dotnet restore TgInfoBot/TgInfoBot.sln

      - name: Build
        run: dotnet build TgInfoBot/TgInfoBot.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TgInfoBot.Tests/TgInfoBot.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
