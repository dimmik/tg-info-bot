name: Docker Publish

# Per-branch group: a beta push must not cancel an in-flight master build.
concurrency:
  group: tg-info-bot-docker-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - beta
      - 'beta/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IS_BETA: ${{ github.ref == 'refs/heads/beta' || startsWith(github.ref, 'refs/heads/beta/') }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # master -> latest + <timestamp>; beta, beta/* -> beta-latest + beta-<timestamp>.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD-HHmmss' tz='UTC'}},enable={{is_default_branch}}
            type=raw,value=beta-latest,enable=${{ env.IS_BETA }}
            type=raw,value=beta-{{date 'YYYYMMDD-HHmmss' tz='UTC'}},enable=${{ env.IS_BETA }}
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          context: ./TgInfoBot
          file: ./TgInfoBot/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
